<svg width="100%" viewBox="0 0 720 550" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title style="fill:rgb(0, 0, 0);font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;">Architecture for local-language elderly medicine reminder system</title>
<desc style="fill:rgb(0, 0, 0);font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;">Flow from voice input through translation, LLM intent extraction, validation, rule-based scheduler, MongoDB, and back out through TTS and a delivery channel like phone call or SMS.</desc>
